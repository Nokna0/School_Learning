server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF 업로드 등 대용량 요청 허용 (서버 측 제한 50MB와 동일)
    client_max_body_size 50m;

    # REST API + tRPC (서버가 /api/trpc도 직접 서빙)
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 헬스 체크
    location /health {
        proxy_pass http://server:3000/health;
    }

    # .mjs(ES 모듈) — 기본 mime.types에 없어서 octet-stream으로 서빙되면
    # 브라우저가 모듈 워커 로딩을 거부한다(pdfjs 워커가 이 형식). JS로 강제 지정.
    # (regex location이라 아래 /assets/ 프리픽스보다 우선 적용됨)
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅: 나머지는 모두 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
